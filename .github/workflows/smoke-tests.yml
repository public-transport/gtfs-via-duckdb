name: smoke tests with GTFS datasets

on:
  push:
    branches:
      - main

jobs:
  smoke-test-vbb:
    name: run VBB smoke test
    uses: './.github/workflows/smoke-test.yml'
    with:
      feed-name: VBB
      feed-download-cmd: 'wget -nv -U "${{ github.repository }} CI" --compression auto -r --no-parent --no-directories -R .csv.gz -R .csv.br -P gtfs -N "https://vbb-gtfs.jannisr.de/latest/"'
      feed-extract-cmd: ''
      feed-import-flags: ''
      feed-import-glob: 'gtfs/*.csv'
  smoke-test-entur:
    name: run Entur smoke test
    uses: './.github/workflows/smoke-test.yml'
    with:
      feed-name: Entur
      feed-download-cmd: 'wget -nv -U "${{ github.repository }} CI" "https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_norway-aggregated-gtfs.zip" -O gtfs.zip'
      feed-extract-cmd: 'unzip -d gtfs gtfs.zip && qsv select "!feed_id" gtfs/feed_info.txt | sponge gtfs/feed_info.txt'
      feed-import-flags: '--route-types-scheme tpeg-pti'
      feed-import-glob: 'gtfs/*.txt'
  smoke-test-vgn:
    name: run VGN smoke test
    uses: './.github/workflows/smoke-test.yml'
    with:
      feed-name: VGN
      feed-download-cmd: 'wget -nv -U "${{ github.repository }} CI" "https://www.vgn.de/opendata/GTFS.zip" -O gtfs.zip'
      feed-extract-cmd: 'unzip -d gtfs gtfs.zip'
      feed-import-flags: '--trips-without-shape-id'
      feed-import-glob: 'gtfs/*.txt'
  smoke-test-vvs:
    name: run VVS smoke test
    uses: './.github/workflows/smoke-test.yml'
    with:
      feed-name: VVS
      feed-download-cmd: 'wget -nv -U "${{ github.repository }} CI" "https://download.vvs.de/gtfs_realtime.zip" -O gtfs.zip'
      feed-extract-cmd: 'unzip -d gtfs gtfs.zip && rm gtfs/ticketing_deep_links.txt gtfs/ticketing_identifiers.txt && qsv select "!ticketing_deep_link_id" gtfs/agency.txt | sponge gtfs/agency.txt && qsv select "!ticketing_deep_link_id" gtfs/routes.txt | sponge gtfs/routes.txt'
      feed-import-flags: '--trips-without-shape-id --lower-case-lang-codes'
      feed-import-glob: 'gtfs/*.txt'
