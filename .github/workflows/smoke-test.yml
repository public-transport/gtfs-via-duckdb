name: smoke test with GTFS dataset

on:
  workflow_call:
    inputs:
      feed-name:
        required: true
        type: string
      feed-download-cmd:
        required: true
        type: string
      feed-extract-cmd:
        required: true
        type: string
      feed-import-glob:
        required: true
        type: string
      feed-import-flags:
        required: true
        type: string

jobs:
  smoke-test:
    name: run ${{ inputs.feed-name }} smoke test
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v2
    - name: setup Node
      uses: actions/setup-node@v1
      with:
        node-version: '22.x'

    - run: npm install

    - name: import ${{ inputs.feed-name }} GTFS
      run: |
        set -e
        set -o pipefail
        set -x

        db_name="${{ inputs.feed-name }}"

        # download & extract GTFS
        ${{ inputs.feed-download-cmd }}
        ${{ inputs.feed-extract-cmd }}

        # import GTFS
        ./cli.js -d ${{ inputs.feed-import-flags }} -- \
          "$db_name" \
          ${{ inputs.feed-import-glob }}
        # test if data has been imported
        duckdb -readonly -csv -c 'SELECT * FROM service_days LIMIT 1' "$db_name" | wc -l

        # delete database
        rm "$db_name"
